<!doctype html>
<html lang="zh-CN" data-mh-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="初中数学互动模型实验室：把定理、公式和最值模型变成可拖动、可调节、可播放的交互课件。">
<title>数学互动实验室 · 初中交互模型课件库</title>
<style>/* ============ MathHub 设计系统 · 风格 A「几何手账」 ============
   暖米纸底 + 楷体标题 + 朱砂主色 + 虚线手账描边 + 方格纸画布
   几何图形配色见 src/engine.js 的 COLORS（与本文件色板同源）        */
:root{
  --mh-font-kai:"STKaiti","KaiTi","STSong","Songti SC",serif;
  --mh-bg:#fbf7f0; --mh-panel:#fffdf8; --mh-ink:#3d3229; --mh-muted:#8a7a68;
  --mh-line:#e8ddcc; --mh-grid:#f1e7d5; --mh-canvas-bg:#fdfaf3;
  --mh-primary:#c2563c; --mh-primary-soft:#fbf0e7; --mh-primary-line:#efcdbc;
  --mh-blue:#3c6e8f; --mh-orange:#c2703a; --mh-green:#4f7a5b; --mh-red:#b8402f;
  --mh-teal:#2f7d74; --mh-shadow:0 3px 0 rgba(120,90,55,.08);
  --mh-radius:14px;
}
:root[data-mh-theme="dark"]{
  --mh-bg:#221d17; --mh-panel:#2c261e; --mh-ink:#f1e7d7; --mh-muted:#ab9c85;
  --mh-line:#4a3f32; --mh-grid:#3a3127; --mh-canvas-bg:#262019;
  --mh-primary:#e8856d; --mh-primary-soft:#3a2a22; --mh-primary-line:#6f4637;
  --mh-blue:#8fbcd8; --mh-orange:#e0a468; --mh-green:#8fc09a; --mh-red:#e48b7a;
  --mh-teal:#79bdb3; --mh-shadow:0 3px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--mh-bg);color:var(--mh-ink);line-height:1.6;font-size:14px;
  -webkit-font-smoothing:antialiased;
}
/* 手账纸底：极淡的横向横线纹理（可见于大面积留白处） */
body:before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(160,130,90,.045) 32px);
}
a{color:var(--mh-primary);text-decoration:none}
button{font-family:inherit}

/* ---------- 顶栏 ---------- */
.mh-top{
  position:sticky;top:0;z-index:50;background:var(--mh-panel);
  border-bottom:2px dashed var(--mh-line);box-shadow:var(--mh-shadow);
  transition:transform .32s ease,box-shadow .32s ease;will-change:transform;
}
/* 模型页滚动智能收起：向下滚动时平滑上移隐藏，回到顶部或上滑时展开 */
.mh-top.mh-hide{transform:translateY(-100%);box-shadow:none}
.mh-top-in{
  max-width:1280px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.mh-brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.mh-logo{
  width:38px;height:38px;border:2px solid var(--mh-primary);border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--mh-primary);font-weight:900;font-size:18px;letter-spacing:-1px;
  transform:rotate(-5deg);font-family:var(--mh-font-kai);
}
.mh-brand-txt b{font-size:17px;display:block;line-height:1.2;font-family:var(--mh-font-kai)}
.mh-brand-txt span{font-size:11px;color:var(--mh-muted)}
.mh-brand-txt .mh-by{color:var(--mh-primary);font-weight:600;margin-top:1px}
.mh-brand-txt .mh-by em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.85}
/* 版本更新入口与浮层 */
.mh-version{position:relative;flex-shrink:0}
.mh-version-btn{
  border:1.5px dashed var(--mh-primary-line);background:var(--mh-canvas-bg);
  color:var(--mh-primary);border-radius:999px;padding:6px 12px;cursor:pointer;
  font-size:11.5px;font-family:var(--mh-font-kai);font-weight:700;white-space:nowrap;
}
.mh-version-btn:hover{border-style:solid;background:var(--mh-primary-soft)}
.mh-version-pop{
  position:absolute;top:calc(100% + 8px);left:0;width:290px;z-index:90;
  background:var(--mh-panel);border:1.5px solid var(--mh-line);border-radius:12px;
  box-shadow:0 12px 32px rgba(90,62,38,.16);padding:13px 15px;
}
.mh-version-head{font-family:var(--mh-font-kai);font-weight:800;font-size:14px;color:var(--mh-primary);margin-bottom:7px}
.mh-version-body{font-size:12px;line-height:1.7;color:var(--mh-ink)}
/* 更新日志分页 */
.mh-change-title{font-family:var(--mh-font-kai);font-weight:800;font-size:14px;color:var(--mh-primary);margin-bottom:9px;display:flex;align-items:center;gap:5px}
.mh-change-list{min-height:96px}
.mh-change-item{padding:8px 0;border-bottom:1px dashed var(--mh-line)}
.mh-change-item:first-child{padding-top:0}
.mh-change-item:last-child{border-bottom:none;padding-bottom:2px}
.mh-change-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.mh-change-ver{font-family:var(--mh-font-kai);font-weight:800;font-size:13px;color:var(--mh-primary);
  background:var(--mh-primary-soft);border-radius:6px;padding:1px 7px}
.mh-change-ver.mh-change-dev{font-size:11px;font-weight:600;opacity:.8;background:transparent;
  border:1px dashed var(--mh-primary-line);padding:0 6px}
.mh-change-date{font-size:10.5px;color:var(--mh-muted);font-variant-numeric:tabular-nums}
.mh-change-body{font-size:11.5px;line-height:1.65;color:var(--mh-ink)}
.mh-change-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin-top:10px;padding-top:9px;border-top:1px dashed var(--mh-line)}
.mh-change-btn{font-family:var(--mh-font-kai);font-size:11px;font-weight:700;color:var(--mh-primary);
  background:var(--mh-canvas-bg);border:1.5px solid var(--mh-primary-line);border-radius:8px;
  padding:5px 9px;cursor:pointer;white-space:nowrap;min-height:30px;transition:background .15s,border-color .15s}
.mh-change-btn:hover:not(:disabled){background:var(--mh-primary-soft);border-style:solid}
.mh-change-btn:disabled{opacity:.38;cursor:not-allowed;border-style:dashed}
.mh-change-page{font-size:10.5px;color:var(--mh-muted);text-align:center;flex:1;font-variant-numeric:tabular-nums}
.mh-change-empty{font-size:12px;color:var(--mh-muted);text-align:center;padding:22px 0;font-family:var(--mh-font-kai)}
.mh-search{
  flex:1;min-width:160px;max-width:360px;margin-left:auto;position:relative;
}
.mh-search input{
  width:100%;padding:8px 12px 8px 34px;border:1.5px dashed var(--mh-line);
  border-radius:9px;background:var(--mh-canvas-bg);color:var(--mh-ink);font-size:13px;outline:none;
}
.mh-search input:focus{border-color:var(--mh-primary);border-style:solid}
.mh-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.mh-iconbtn{
  border:1.5px solid var(--mh-line);background:var(--mh-panel);color:var(--mh-ink);
  border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13px;flex-shrink:0;
}
.mh-iconbtn:hover{border-color:var(--mh-primary);color:var(--mh-primary)}

/* ---------- 搜索结果浮层 ---------- */
.mh-search-wrap{position:relative;flex:1;min-width:160px;max-width:360px;margin-left:auto}
.mh-search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--mh-panel);border:1.5px solid var(--mh-line);border-radius:11px;
  box-shadow:0 12px 32px rgba(90,62,38,.15);max-height:420px;overflow:auto;z-index:80;
}
.mh-sr-item{padding:9px 13px;cursor:pointer;border-bottom:1px dashed var(--mh-line)}
.mh-sr-item:last-child{border-bottom:0}
.mh-sr-item:hover{background:var(--mh-primary-soft)}
.mh-sr-item b{font-size:13px;display:block}
.mh-sr-item span{font-size:11px;color:var(--mh-muted)}

/* ---------- 主容器 ---------- */
.mh-main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}

/* ---------- 面包屑 ---------- */
.mh-crumb{font-size:12px;color:var(--mh-muted);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mh-crumb a{cursor:pointer}
.mh-crumb .sep{opacity:.5}

/* ---------- 首页 hero ---------- */
.mh-hero{
  border-radius:18px;padding:30px 34px;margin-bottom:24px;position:relative;overflow:hidden;
  background:var(--mh-panel);border:2px solid var(--mh-line);box-shadow:var(--mh-shadow);
}
.mh-hero:after{
  content:"∑  ∩  △  ∠  ≌  ∵  ∴";position:absolute;right:18px;top:16px;
  font-size:16px;color:var(--mh-line);letter-spacing:9px;font-family:var(--mh-font-kai);
}
.mh-hero h1{margin:0 0 8px;font-size:30px;line-height:1.3;color:var(--mh-primary);font-family:var(--mh-font-kai)}
.mh-hero p{margin:0;color:var(--mh-muted);max-width:720px;font-size:14px}
.mh-hero-stats{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
.mh-hero-stats div b{font-size:24px;color:var(--mh-orange);display:block;line-height:1.1;font-family:var(--mh-font-kai)}
.mh-hero-stats div span{font-size:12px;color:var(--mh-muted)}

/* ---------- 领域卡片 ---------- */
.mh-section-title{
  font-size:18px;font-weight:700;margin:26px 0 13px;display:flex;align-items:center;gap:9px;
  font-family:var(--mh-font-kai);
}
.mh-section-title:before{content:"✦";color:var(--mh-orange);font-size:15px}
.mh-section-title i{display:none}
.mh-domains{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mh-domain{
  background:var(--mh-panel);border:1.5px solid var(--mh-line);border-radius:var(--mh-radius);
  padding:20px;cursor:pointer;box-shadow:var(--mh-shadow);transition:transform .18s,border-color .18s;
  border-top:5px solid var(--dc,var(--mh-primary));
}
.mh-domain:hover{transform:translateY(-3px) rotate(-.5deg)}
.mh-domain h3{margin:0 0 6px;font-size:18px;font-family:var(--mh-font-kai)}
.mh-domain p{margin:0 0 14px;font-size:12px;color:var(--mh-muted);min-height:34px}
.mh-domain .mh-dom-meta{display:flex;gap:12px;font-size:11px;color:var(--mh-muted);flex-wrap:wrap}
.mh-domain .mh-dom-meta b{color:var(--dc,var(--mh-primary));font-size:17px;display:block;font-family:var(--mh-font-kai)}

/* ---------- 主题 / 模型网格 ---------- */
.mh-topic{margin-bottom:24px}
.mh-topic h3{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;font-family:var(--mh-font-kai)}
.mh-topic h3 small{font-weight:400;color:var(--mh-muted);font-size:12px;font-family:sans-serif}
.mh-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
/* 统一模型卡片：顶部标签 / 标题 / 简介 / 底部操作 四区层级 */
.mh-card{
  position:relative;display:flex;flex-direction:column;min-height:170px;
  container-type:inline-size; /* 简介按卡片自身宽度自适应行数，与视口断点解耦 */
  background:var(--mh-panel);border:1.5px solid var(--mh-line);border-radius:var(--mh-radius);
  padding:16px 17px 12px;cursor:pointer;overflow:hidden;
  box-shadow:var(--mh-shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  border-top:4px solid var(--mh-line);
}
/* 顶部 4 色轮换细边，统一风格 */
.mh-card:nth-child(4n+1){border-top-color:var(--mh-primary)}
.mh-card:nth-child(4n+2){border-top-color:var(--mh-blue)}
.mh-card:nth-child(4n+3){border-top-color:var(--mh-orange)}
.mh-card:nth-child(4n+4){border-top-color:var(--mh-green)}
/* 悬停：上浮、阴影加深、边框转实线，过渡自然 */
.mh-card:hover{
  transform:translateY(-4px);
  border-color:var(--mh-primary-line);
  box-shadow:0 12px 26px rgba(90,62,38,.16);
}
.mh-card:active{transform:translateY(-1px)}
.mh-card:focus-visible{outline:2px solid var(--mh-primary);outline-offset:2px}
:root[data-mh-theme="dark"] .mh-card:hover{box-shadow:0 12px 26px rgba(0,0,0,.4)}
/* 标题行：等级标签与标题始终同一行，两者均不换行、不截断 */
.mh-card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.mh-card-title{
  flex:1 1 auto;min-width:0;margin:0;font-size:16px;line-height:1.45;color:var(--mh-ink);
  font-family:var(--mh-font-kai);font-weight:700;
  overflow-wrap:break-word;word-break:break-word; /* 标题完整可见：长标题在剩余宽度内折行，绝不截断 */
}
/* 等级标签：不换行、不被压缩，始终完整可见 */
.mh-level{flex:0 0 auto;white-space:nowrap;margin-top:1px}
/* 简介：默认两行；由容器查询按卡片实际宽度自动匹配行数（尺寸变化即自适应） */
.mh-card-desc{
  margin:0 0 12px;font-size:12px;color:var(--mh-muted);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;
}
/* 小卡(窄)<270px 保持2行；中卡 270–340px 显示3行；大卡≥340px 显示4行，文案随尺寸匹配 */
@container (min-width:270px){.mh-card-desc{-webkit-line-clamp:3;min-height:57px}}
@container (min-width:340px){.mh-card-desc{-webkit-line-clamp:4;min-height:76px}}
/* 底部操作区：进入提示 + 收藏按钮，与主体用虚线分隔 */
.mh-card-foot{
  margin-top:auto;padding-top:10px;border-top:1px dashed var(--mh-line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.mh-card-go{font-size:11px;color:var(--mh-primary);font-weight:600;opacity:.85}
.mh-card-go span{font-size:14px;transition:transform .2s ease;display:inline-block}
.mh-card:hover .mh-card-go span{transform:translateX(3px)}
/* 等级标签（统一 pill） */
.mh-level{font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.5px;
  border:1px solid transparent}
.mh-level-1{background:#e8f3ea;color:#356b45;border-color:#cfe6d4}
.mh-level-2{background:#faf0dd;color:#96601f;border-color:#efdcb8}
.mh-level-3{background:#f9e6e0;color:#a33c2a;border-color:#f0cdc2}
:root[data-mh-theme="dark"] .mh-level-1{background:#274a32;color:#a7d8b4;border-color:#3a6647}
:root[data-mh-theme="dark"] .mh-level-2{background:#5a421d;color:#f0c887;border-color:#7a5c2a}
:root[data-mh-theme="dark"] .mh-level-3{background:#5e2c23;color:#f3b3a4;border-color:#8a4639}
/* 收藏按钮：统一圆形描边按钮，点击区更大 */
.mh-fav{
  flex-shrink:0;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;border:1.5px dashed var(--mh-line);border-radius:50%;
  background:var(--mh-canvas-bg);color:var(--mh-orange);padding:0;line-height:1;
  transition:background .18s,border-color .18s,transform .18s;
}
.mh-fav:hover{border-style:solid;border-color:var(--mh-orange);transform:scale(1.1)}
.mh-fav.on{border-style:solid;border-color:var(--mh-orange);background:var(--mh-primary-soft)}
/* 已学状态：左侧色条 + 标题后对勾 */
.mh-card.done{border-left:3px solid var(--mh-green)}
.mh-card.done .mh-card-title:after{content:"✓";color:var(--mh-green);font-size:13px;margin-left:6px;font-family:sans-serif}

/* ---------- 模型工作台 ---------- */
.mh-work{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.mh-panel{
  background:var(--mh-panel);border:1.5px solid var(--mh-line);
  border-radius:var(--mh-radius);box-shadow:var(--mh-shadow);
}
.mh-side{padding:16px;position:sticky;top:80px;order:-1;grid-row:1 / span 2}
.mh-stage-col{order:0;min-width:0;grid-column:2;grid-row:1}
.mh-notes{grid-column:2;grid-row:2}
.mh-side h3,.mh-side .mh-side-h{font-size:14px;margin:0 0 4px;font-family:var(--mh-font-kai)}
.mh-side .mh-side-sub{font-size:11px;color:var(--mh-muted);margin:0 0 12px}
/* 面板折叠开关：桌面端隐藏，移动端显示 */
.mh-fold{display:none;width:100%;align-items:center;justify-content:space-between;
  border:0;background:none;color:var(--mh-ink);font-size:14px;font-weight:700;
  font-family:var(--mh-font-kai);padding:0;cursor:pointer}
.mh-fold-caret{font-size:12px;color:var(--mh-muted);transition:transform .18s}
.mh-side.collapsed .mh-fold-caret{transform:rotate(-90deg)}
.mh-ctl{margin-bottom:14px}
.mh-ctl-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--mh-muted);margin-bottom:5px}
.mh-ctl-lab b{color:var(--mh-ink);font-variant-numeric:tabular-nums}
.mh-ctl input[type=range]{width:100%;accent-color:var(--mh-primary);margin:0}
.mh-check{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:9px 0;cursor:pointer}
.mh-check input{accent-color:var(--mh-primary);width:15px;height:15px;cursor:pointer}
.mh-btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.mh-mini{
  border:1.5px solid var(--mh-line);background:var(--mh-canvas-bg);color:var(--mh-ink);
  border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;transition:.15s;
}
.mh-mini:hover{border-color:var(--mh-primary);color:var(--mh-primary)}
.mh-mini.on{background:var(--mh-primary);border-color:var(--mh-primary);color:#fff}
.mh-wide{width:100%;margin:6px 0}
.mh-side-divider{height:0;border-top:1px dashed var(--mh-line);margin:14px 0}

.mh-stage{padding:12px}
.mh-stage-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:2px 4px 9px}
.mh-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mh-muted)}
.mh-legend i{display:inline-block;width:14px;height:0;border-top:3px solid;vertical-align:3px;margin-right:4px;border-radius:2px}
.mh-zoom{display:flex;gap:4px;align-items:center;margin-left:auto}
.mh-zoom button{
  border:1.5px solid var(--mh-line);background:var(--mh-canvas-bg);color:var(--mh-ink);
  border-radius:8px;padding:3px 9px;font-size:13px;cursor:pointer;min-width:30px;
}
.mh-zoom .mh-lock{font-size:12px;white-space:nowrap;min-width:74px}
.mh-zoom .mh-lock[aria-pressed="true"]{
  background:var(--mh-primary);border-color:var(--mh-primary);color:#fff;
}
.mh-zoom .zlevel{font-size:11px;color:var(--mh-muted);min-width:38px;text-align:center}
.mh-canvas-wrap{position:relative}
.mh-canvas{
  width:100%;height:auto;display:block;background:var(--mh-canvas-bg);
  border:2px dashed var(--mh-line);border-radius:10px;touch-action:none;cursor:grab;
}
.mh-canvas.mh-canvas-locked{cursor:not-allowed}
/* 拖动交互期间：全局禁用文本选中，防止坐标轴数字与页面文字出现蓝色高亮。
   松手后 body 移除 .mh-dragging，文本选择恢复正常。 */
body.mh-dragging,body.mh-dragging *{
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;
}
body.mh-dragging .mh-canvas text{user-select:none!important}
/* 锁定遮罩：画布顶部提示「点击解锁」，不覆盖坐标刻度与图像主体，不拦截指针（逻辑层已禁交互） */
.mh-lock-veil{
  position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;
  pointer-events:none;border-radius:10px;background:rgba(251,247,240,.34);
  border:2px dashed var(--mh-primary-line);z-index:2;transition:opacity .18s;
}
:root[data-mh-theme="dark"] .mh-lock-veil{background:rgba(38,32,25,.42)}
.mh-lock-veil.hidden{display:none}
.mh-lock-msg{
  font-family:var(--mh-font-kai);font-size:14px;font-weight:700;color:var(--mh-primary);
  background:var(--mh-canvas-bg);border:1.5px solid var(--mh-primary-line);
  border-radius:999px;padding:7px 16px;box-shadow:0 3px 12px rgba(92,40,28,.12);
  white-space:nowrap;max-width:92%;text-align:center;margin-top:10px;
}
.mh-readout-wrap{padding:8px 4px 2px}
#mh-readout{
  font-size:12px;background:var(--mh-primary-soft);border:1px solid var(--mh-primary-line);
  border-left:4px solid var(--mh-primary);
  color:var(--mh-ink);border-radius:8px;padding:6px 11px;font-variant-numeric:tabular-nums;
}
.mh-hint{font-size:11.5px;color:var(--mh-muted);padding:8px 4px 2px}

/* ---------- 说明区 ---------- */
.mh-notes{padding:18px 22px;margin-top:16px;font-size:13px}
.mh-notes h3{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:7px;font-family:var(--mh-font-kai)}
.mh-notes h3:not(:first-child){margin-top:18px}
.mh-notes h3:before{content:"✦";color:var(--mh-orange);font-size:13px}
.mh-notes p{margin:6px 0}
.mh-notes .mh-oneline{
  background:var(--mh-primary-soft);border:1px solid var(--mh-primary-line);
  border-left:4px solid var(--mh-primary);border-radius:8px;padding:10px 13px;color:var(--mh-ink);
}
.mh-notes ol,.mh-notes ul{padding-left:22px;margin:6px 0}
.mh-notes li{margin:5px 0}
.mh-formula{
  background:var(--mh-canvas-bg);border:1px dashed var(--mh-line);border-left:4px solid var(--mh-orange);
  border-radius:7px;padding:11px 14px;font-size:14px;margin:9px 0;overflow-x:auto;
  line-height:2;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;
}
/* LaTeX/MathML 规范排版：清晰字号与合理间距 */
.mh-math{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:1.06em;line-height:1.2}
.mh-math math{display:inline}
.mh-formula .mh-math{margin:0 1px}
/* 数学片段中的中文叙述以普通字体显示 */
math mtext{font-family:inherit}
:root[data-mh-theme="dark"] .mh-math{color:var(--mh-ink)}
.mh-tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;
  background:var(--mh-primary-soft);color:var(--mh-primary);border:1px solid var(--mh-primary-line);margin-right:6px}

/* ---------- 筛选栏 ---------- */
.mh-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.mh-filters .mh-chip{
  border:1.5px solid var(--mh-line);background:var(--mh-panel);color:var(--mh-ink);
  border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer;
}
.mh-filters .mh-chip.on{background:var(--mh-primary);border-color:var(--mh-primary);color:#fff}
.mh-filters .mh-sep{width:1px;height:20px;border-left:1px dashed var(--mh-line);margin:0 4px}

/* ---------- 空状态 ---------- */
.mh-empty{text-align:center;padding:60px 20px;color:var(--mh-muted)}
.mh-empty h3{color:var(--mh-ink);margin:0 0 8px;font-family:var(--mh-font-kai)}

/* ---------- 页脚 ---------- */
.mh-footer{text-align:center;color:var(--mh-muted);font-size:12px;padding:30px 20px 10px;border-top:2px dashed var(--mh-line);margin-top:40px}

/* ---------- 响应式 ---------- */
@media(max-width:1080px){
  .mh-domains{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mh-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* 平板竖屏及手机（≤900px）：模型工作台改为画布优先 + 控件折叠，
   避免 768~900px 仍按桌面双栏把画布挤窄。首页两栏卡片保持到 760px 再单列。 */
@media(max-width:900px){
  /* 模型工作台：画布优先，控制面板折叠为抽屉 */
  .mh-work{display:flex;flex-direction:column;gap:12px}
  .mh-stage-col{order:1;width:100%}
  .mh-side{order:2;width:100%;position:static;padding:12px 14px;grid-row:auto}
  .mh-notes{order:3;width:100%;grid-column:auto;grid-row:auto}
  /* 折叠态：只保留开关条，隐藏控件体 */
  .mh-fold{display:flex}
  .mh-side .mh-side-body{display:block;margin-top:12px}
  .mh-side.collapsed .mh-side-body{display:none}
  .mh-side.collapsed{padding:11px 14px}
  /* 画布占比：尽量高、减少留白 */
  .mh-stage{padding:9px}
  .mh-stage-head{gap:6px;padding:2px 2px 7px}
  .mh-legend{gap:9px;font-size:10.5px}
  .mh-canvas{width:100%}
  .mh-lock-msg{font-size:11px;padding:8px 13px;max-width:88%}
  /* 按钮压缩：减小内边距与字号，减少纵向占位 */
  .mh-mini{padding:6px 9px;font-size:11.5px;border-radius:7px;min-height:32px}
  .mh-btnrow{gap:5px;margin:6px 0}
  .mh-zoom button,.mh-lock{padding:3px 7px;font-size:11.5px;min-width:26px}
  .mh-notes{padding:15px 16px}
  /* 调节面板紧凑：缩小内边距、控件与分隔间距，按钮保持可触摸尺寸 */
  .mh-side{padding:10px 12px}
  .mh-side.collapsed{padding:9px 12px}
  .mh-side .mh-side-body{margin-top:8px}
  .mh-side .mh-side-h{font-size:13px;margin-bottom:2px}
  .mh-side .mh-side-sub{font-size:10.5px;margin-bottom:8px}
  .mh-ctl{margin-bottom:8px}
  .mh-ctl-lab{font-size:11px;margin-bottom:3px}
  .mh-check{font-size:11.5px;margin:6px 0}
  .mh-check input{width:16px;height:16px}
  .mh-side-divider{margin:8px 0}
  .mh-wide{margin:4px 0}
}
@media(max-width:760px){
  .mh-top-in{padding:9px 14px;gap:9px}
  .mh-brand-txt span{display:none}
  .mh-brand-txt .mh-by{display:block;font-size:10px}
  .mh-version-btn{padding:5px 9px;font-size:10.5px}
  .mh-version-pop{width:min(290px,86vw);left:auto;right:0}
  .mh-change-btn{padding:5px 7px;font-size:10.5px;min-height:32px;min-width:60px}
  .mh-change-page{font-size:10px}
  .mh-change-nav{gap:4px}
  .mh-search-wrap{max-width:none;order:3;flex-basis:100%;margin-left:0}
  .mh-main{padding:13px 13px 50px}
  /* hero 紧凑：缩小标题/正文/统计，减少纵向占位 */
  .mh-hero{padding:16px 18px;margin-bottom:14px}
  .mh-hero h1{font-size:21px;margin-bottom:6px}
  .mh-hero p{font-size:12px;line-height:1.55}
  .mh-hero-stats{gap:0;margin-top:12px;justify-content:space-between;flex-wrap:nowrap}
  .mh-hero-stats div{flex:1;text-align:center}
  .mh-hero-stats div b{font-size:19px}
  .mh-hero-stats div span{font-size:11px}
  .mh-hero:after{display:none}
  /* 区块标题上间距收紧 */
  .mh-section-title{margin:15px 0 10px;font-size:17px}
  /* 领域卡片：两列网格 + 紧凑内部，确保首屏完整呈现 */
  .mh-domains{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .mh-domain{padding:12px 13px 11px;border-top-width:4px}
  .mh-domain h3{font-size:16px;margin-bottom:4px}
  .mh-domain p{font-size:11px;line-height:1.45;min-height:0;margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mh-domain .mh-dom-meta{gap:8px;font-size:10px}
  .mh-domain .mh-dom-meta b{font-size:14px}
  /* 子页面模型卡片：两列网格 + 紧凑内部，与首页领域卡片节奏统一 */
  .mh-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .mh-card{min-height:150px;padding:12px 12px 9px;border-radius:12px}
  .mh-card-head{gap:6px;margin-bottom:5px}
  .mh-card-title{font-size:14px}
  .mh-card-desc{font-size:11px;line-height:1.5;min-height:34px;margin-bottom:8px}
  .mh-level{font-size:9.5px;padding:2px 7px}
  .mh-card-foot{padding-top:7px}
  .mh-card-go{font-size:10px}
  .mh-fav{width:27px;height:27px;font-size:14px}
}
/* 超窄屏（≤360px）：进一步压缩，保持两列不溢出 */
@media(max-width:360px){
  .mh-hero{padding:12px 13px;margin-bottom:10px}
  .mh-hero h1{font-size:18px;margin-bottom:4px}
  .mh-hero p{font-size:11px;line-height:1.45}
  .mh-hero-stats{margin-top:9px}
  .mh-hero-stats div b{font-size:17px}
  .mh-section-title{margin:11px 0 8px;font-size:16px}
  .mh-domains{gap:7px}
  .mh-domain{padding:9px 9px 8px}
  .mh-domain h3{font-size:14px;margin-bottom:3px}
  .mh-domain p{font-size:10.5px;margin-bottom:6px}
  .mh-domain .mh-dom-meta{gap:4px;font-size:9.5px}
  .mh-domain .mh-dom-meta b{font-size:13px}
  .mh-cards{gap:7px}
  .mh-card{min-height:138px;padding:10px 9px 8px}
  .mh-card-title{font-size:13px}
  .mh-card-desc{font-size:10.5px;min-height:31px}
  .mh-fav{width:24px;height:24px;font-size:13px}
}
@media(min-width:2000px){
  .mh-main,.mh-top-in{max-width:1500px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}

<body>
<div id="mh-app"></div>
<script>/* ============================================================
 * MathHub Engine — 通用几何/函数交互场景引擎
 * 数据驱动：每个模型声明 {id,title,domain,topic,level,brief,idea,proof,
 *                          controls,init,draw,onPointer,...}
 * 依赖：零。ES5 兼容写法为主。
 * ============================================================ */
(function(global){
  'use strict';
  var NS='http://www.w3.org/2000/svg';
  /* 风格 A「几何手账」图形色板：低饱和暖调，与 CSS 变量同源，仍保证多图形可辨。
     红/橙/绿保留色相，故模型文案中「红色点/橙色虚线/绿色构造点」依旧准确。 */
  var COLORS={blue:'#3c6e8f',orange:'#c2703a',purple:'#9d5b7a',green:'#4f7a5b',
    red:'#b8402f',teal:'#2f7d74',slate:'#6b5c49',gray:'#a89a85'};

  /* ---------- 向量工具（暴露给模型） ---------- */
  function add(a,b){return {x:a.x+b.x,y:a.y+b.y};}
  function sub(a,b){return {x:a.x-b.x,y:a.y-b.y};}
  function mul(a,k){return {x:a.x*k,y:a.y*k};}
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
  function unit(v){var d=Math.hypot(v.x,v.y)||1;return {x:v.x/d,y:v.y/d};}
  function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
  function angDiff(a,b){var d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
  function lerp(a,b,t){return a+(b-a)*t;}
  function lerp2(a,b,t){return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)};}

  /* ---------- Board：一个 SVG 场景实例 ---------- */
  function Board(svg, model){
    this.svg=svg;
    this.model=model;
    this.W=model.W||900;
    this.H=model.H||600;
    this.yUp=model.yUp===true; // 默认屏幕坐标（y 向下）；数学坐标模型显式设 yUp:true
    this.view={x:model.viewX||0,y:model.viewY||0,w:model.W||900,h:model.H||600};
    this.baseView={x:this.view.x,y:this.view.y,w:this.view.w,h:this.view.h};
    this.state={};
    this.pan=null;
    this.drag=null;
    this.playing=false;
    this._tween=null; // 参数补间动画：按钮触发的平滑过渡（缓入缓出）
    this.locked=true; // 画布默认锁定：新建/加载即锁定，须手动解锁后才能编辑（每个 Board 实例独立）
    this.t=0;
    this.speed=1;
    this.reduced=global.matchMedia&&global.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // 智能播放：无 step 的模型，若有 range 控件则记录第一个用于自动扫描；否则无可动参数
    this._autoCtl=null;
    if(!model.step){
      var ctrls=model.controls||[];
      for(var ci=0;ci<ctrls.length;ci++){
        if(ctrls[ci].type==='range'&&typeof ctrls[ci].min==='number'&&typeof ctrls[ci].max==='number'){
          this._autoCtl=ctrls[ci];break;
        }
      }
    }
    this._buildLayers();
    this._bindView();
    if(model.init) model.init(this,this.state);
    this.applyView();
    this.draw();
    this.svg.classList.toggle('mh-canvas-locked',this.locked);
  }
  Board.prototype._buildLayers=function(){
    var grid=document.createElementNS(NS,'g');
    grid.setAttribute('class','mh-grid');
    var scene=document.createElementNS(NS,'g');
    this.svg.appendChild(grid);
    this.svg.appendChild(scene);
    this.grid=grid;this.scene=scene;
    var W=this.W,H=this.H,step=modelStep(this.model);
    // 网格
    var gx0=Math.floor((this.view.x-step)/step)*step;
    this.gridLines=[];
    for(var x=gx0;x<=this.view.x+this.view.w+step;x+=step){
      this.gridLines.push(this.rawLine(grid,{x:x,y:0},{x:x,y:H},'var(--mh-grid)  ',1));
    }
    for(var y=0;y<=H;y+=step){
      this.gridLines.push(this.rawLine(grid,{x:0,y:y},{x:W,y:y},'var(--mh-grid)',1));
    }
  };
  function modelStep(m){return m.grid||50;}
  Board.prototype.sy=function(y){return this.yUp?this.H-y:y;};

  /* --- 原始绘图（坐标已是屏幕系） --- */
  Board.prototype.rawLine=function(g,p,q,c,w,dash,op){
    var n=document.createElementNS(NS,'line');
    n.setAttribute('x1',p.x);n.setAttribute('y1',p.y);
    n.setAttribute('x2',q.x);n.setAttribute('y2',q.y);
    n.setAttribute('stroke',c||'var(--mh-ink)');
    n.setAttribute('stroke-width',w||2);
    if(dash)n.setAttribute('stroke-dasharray',dash);
    if(op!=null)n.setAttribute('stroke-opacity',op);
    n.setAttribute('stroke-linecap','round');
    g.appendChild(n);return n;
  };
  /* --- 绘图原语（数学坐标，yUp 自动翻转） --- */
  Board.prototype.line=function(p,q,c,w,dash,op,parent){
    return this.rawLine(parent||this.scene,{x:p.x,y:this.sy(p.y)},{x:q.x,y:this.sy(q.y)},c,w,dash,op);
  };
  Board.prototype.circle=function(c,r,stroke,fill,w,dash,op,parent){
    var n=document.createElementNS(NS,'circle');
    n.setAttribute('cx',c.x);n.setAttribute('cy',this.sy(c.y));
    n.setAttribute('r',r);
    n.setAttribute('stroke',stroke||'none');
    n.setAttribute('fill',fill||'none');
    n.setAttribute('stroke-width',w||2);
    if(dash)n.setAttribute('stroke-dasharray',dash);
    if(op!=null)n.setAttribute('stroke-opacity',op);
    (parent||this.scene).appendChild(n);return n;
  };
  Board.prototype.poly=function(pts,fill,op,stroke,w,parent){
    var n=document.createElementNS(NS,'polygon');
    n.setAttribute('points',pts.map(_.bind(function(p){return p.x+','+this.sy(p.y);},this)).join(' '));
    n.setAttribute('fill',fill||'none');
    n.setAttribute('fill-opacity',op==null?1:op);
    n.setAttribute('stroke',stroke||'none');
    n.setAttribute('stroke-width',w||1.5);
    (parent||this.scene).appendChild(n);return n;
  };
  Board.prototype.polyline=function(pts,c,w,dash,op,parent){
    var n=document.createElementNS(NS,'polyline');
    n.setAttribute('points',pts.map(_.bind(function(p){return p.x+','+this.sy(p.y);},this)).join(' '));
    n.setAttribute('fill','none');n.setAttribute('stroke',c||'var(--mh-ink)');
    n.setAttribute('stroke-width',w||2);n.setAttribute('stroke-linecap','round');
    if(dash)n.setAttribute('stroke-dasharray',dash);
    if(op!=null)n.setAttribute('stroke-opacity',op);
    (parent||this.scene).appendChild(n);return n;
  };
  Board.prototype.text=function(p,str,c,size,anchor,weight,parent){
    var n=document.createElementNS(NS,'text');
    n.setAttribute('x',p.x);n.setAttribute('y',this.sy(p.y));
    n.setAttribute('fill',c||'var(--mh-ink)');
    n.setAttribute('font-size',size||13);
    n.setAttribute('text-anchor',anchor||'start');
    n.setAttribute('font-weight',weight||500);
    n.setAttribute('font-family','-apple-system,PingFang SC,Microsoft YaHei,sans-serif');
    n.textContent=str;
    (parent||this.scene).appendChild(n);return n;
  };
  Board.prototype.arc=function(c,r,a0,a1,col,w,parent){
    var pts=[],N=24;
    for(var i=0;i<=N;i++){var a=a0+(a1-a0)*i/N;pts.push({x:c.x+r*Math.cos(a),y:c.y+r*Math.sin(a)});}
    return this.polyline(pts,col,w,null,null,parent);
  };
  /* 直角记号 */
  Board.prototype.rightAngle=function(vertex,dirA,dirB,size,c,parent){
    var u=unit(dirA),v=unit(dirB),s=size||10;
    var p1=add(vertex,mul(u,s)),corner=add(p1,mul(v,s)),p2=add(vertex,mul(v,s));
    this.polyline([p1,corner,p2],c||'var(--mh-muted)',1.6,null,null,parent);
  };
  /* 可拖拽手柄：注册命中区，绘制由模型 draw 决定 */
  Board.prototype.handle=function(p,name,r){
    this._handles=this._handles||[];
    this._handles.push({p:p,name:name,r:r||16});
  };
  /* 读数 */
  Board.prototype.readout=function(str){
    var el=document.getElementById('mh-readout');
    if(el)el.textContent=str;
  };

  /* --- 坐标变换 --- */
  Board.prototype.toWorld=function(e){
    var p=this.svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    var l=p.matrixTransform(this.svg.getScreenCTM().inverse());
    return {x:l.x,y:this.yUp?this.H-l.y:l.y};
  };
  Board.prototype.toView=function(e){
    var p=this.svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;
    return p.matrixTransform(this.svg.getScreenCTM().inverse());
  };
  Board.prototype.applyView=function(){
    var v=this.view;
    this.svg.setAttribute('viewBox',v.x+' '+v.y+' '+v.w+' '+v.h);
    var lbl=document.querySelector('[data-mh-z="'+this.svg.id+'"]');
    if(lbl)lbl.textContent=Math.round(this.baseView.w/v.w*100)+'%';
  };
  Board.prototype.zoomAt=function(factor,anchor){
    if(this.locked)return; // 锁定后禁止缩放
    var v=this.view,p=anchor||{x:v.x+v.w/2,y:v.y+v.h/2};
    var nw=Math.max(160,Math.min(this.W*3,v.w/factor));
    var nh=nw*(v.h/v.w);
    v.x=p.x-(p.x-v.x)*(nw/v.w);
    v.y=p.y-(p.y-v.y)*(nh/v.h);
    v.w=nw;v.h=nh;this.applyView();
  };
  Board.prototype.resetView=function(){
    if(this.locked)return; // 锁定后禁止复位视图（缩放）
    var b=this.baseView;this.view={x:b.x,y:b.y,w:b.w,h:b.h};this.applyView();
  };
  /* 画布锁定开关：锁定态禁止一切画布编辑（拖点/平移/缩放）；解锁后全部恢复。返回当前锁定态 */
  Board.prototype.setLocked=function(v){
    this.locked=!!v;
    this.drag=null;this.pan=null;
    svgCursor(this.svg,''); // 清除内联光标，交给 CSS / pointermove 动态接管
    this.svg.classList.toggle('mh-canvas-locked',this.locked);
    return this.locked;
  };
  function svgCursor(svg,c){if(svg)svg.style.cursor=c;}
  Board.prototype._bindView=function(){
    var self=this,svg=this.svg;
    /* 画布缩放只允许通过锁定键右侧的 ＋/－ 按钮触发。
       这里显式关闭画布区域内的一切手势/操作缩放入口：
       - 滚轮不再缩放（保留浏览器默认页面滚动，不 preventDefault）；
       - 双击不缩放；
       - 捏合/触摸手势不缩放（CSS 已设 touch-action:none，此处对 Safari 兜底）。 */
    svg.addEventListener('dblclick',function(e){e.preventDefault();});
    svg.addEventListener('gesturestart',function(e){e.preventDefault();});
    svg.addEventListener('gesturechange',function(e){e.preventDefault();});
    svg.addEventListener('pointerdown',function(e){
      if(self.locked)return; // 锁定态：禁止一切画布编辑（拖点、平移、缩放）
      // 进入交互态：阻止浏览器默认的文本选取（坐标轴数字/页面文字不再出现蓝色高亮）。
      // 仅当前可动点与画布平移响应指针，松手后在 end() 恢复正常文本选择。
      if(e.cancelable)e.preventDefault();
      document.body.classList.add('mh-dragging');
      var w=self.toWorld(e);
      var best=null,bd=1e9;
      // _handles 由最近一次 draw() 收集，随状态更新保持最新
      (self._handles||[]).forEach(function(h){
        var d=dist(w,h.p);if(d<bd){bd=d;best=h;}
      });
      if(best&&bd<(best.r||16)){
        // 节点/点位：拖动命中点
        self.drag=best.name;
        svg.setPointerCapture(e.pointerId);svg.style.cursor='grabbing';
        if(self.model.onDragStart)self.model.onDragStart(self,best.name,w);
      }else{
        // 画布空白区平移
        var p=self.toView(e);
        self.pan={base:{x:self.view.x,y:self.view.y},anchor:p};
        svg.setPointerCapture(e.pointerId);svg.style.cursor='grabbing';
      }
    });
    svg.addEventListener('pointermove',function(e){
      if(self.pan){
        var p=self.toView(e),v=self.view;
        v.x=self.pan.base.x-(p.x-self.pan.anchor.x);
        v.y=self.pan.base.y-(p.y-self.pan.anchor.y);
        self.applyView();return;
      }
      if(self.drag){
        var w=self.toWorld(e);
        if(self.model.onDrag)self.model.onDrag(self,self.drag,w);
        else if(self.state[self.drag])self.state[self.drag]=w;
        self.draw(); // 拖动后重绘：否则 state 变了但画面/读数不更新
      }
    });
    function end(e){
      self.drag=null;self.pan=null;svg.style.cursor='';
      // 松开指针：恢复正常文本选择状态
      document.body.classList.remove('mh-dragging');
      // pan 之后需重绘 README 读数不受影响
    }
    svg.addEventListener('pointerup',end);
    svg.addEventListener('pointercancel',end);
    // 指针在画布外松开时也要恢复文本选择，避免 body 残留 mh-dragging
    window.addEventListener('pointerup',function(){document.body.classList.remove('mh-dragging');});
    window.addEventListener('pointercancel',function(){document.body.classList.remove('mh-dragging');});
  };
  Board.prototype.draw=function(){
    this.scene.replaceChildren();
    this._handles=[];
    if(this.model.draw)this.model.draw(this,this.state);
    this._collected=true;
  };
  /* 缓入缓出（easeInOutCubic），供参数补间使用 */
  function easeInOut(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  /* 启动一个参数补间动画：to={key:目标值,...}，时长 dur 秒，结束时回调 onDone。
     动画逐帧更新 state 并同步滑块读数，避免瞬间跳转。 */
  Board.prototype.tweenTo=function(to,dur,onDone){
    var from={};
    for(var k in to)if(Object.prototype.hasOwnProperty.call(to,k))from[k]=this.state[k];
    this._tween={from:from,to:to,t:0,dur:dur||0.6,onDone:onDone||null};
  };
  /* 把进行中的补间立即结算到目标值并同步控件，返回是否已结算。
     供按钮在启动新动画前调用，确保基于稳定状态取反，避免连续点击取到中间值。 */
  Board.prototype.finishTween=function(){
    var tw=this._tween;
    if(!tw)return false;
    for(var k in tw.to)if(Object.prototype.hasOwnProperty.call(tw.to,k))this.state[k]=tw.to[k];
    this._tween=null;
    refreshControls(this.state);
    this.draw();
    if(tw.onDone)tw.onDone(this,this.state);
    return true;
  };
  Board.prototype.step=function(dt){
    if(this._tween){
      var tw=this._tween,s=this.state;
      tw.t+=dt;
      var p=Math.min(1,tw.t/tw.dur),e=easeInOut(p);
      for(var k in tw.to)if(Object.prototype.hasOwnProperty.call(tw.to,k))
        s[k]=tw.from[k]+(tw.to[k]-tw.from[k])*e;
      refreshControls(s); // 图像与滑块位置同步
      if(p>=1){var done=tw.onDone;this._tween=null;if(done)done(this,s);}
      this.draw();
      return; // 补间期间优先，避免与播放扫描叠加
    }
    if(this.playing){
      this.t+=dt*this.speed;
      if(this.model.step){
        this.model.step(this,this.state,dt);
      }else if(this._autoCtl){
        // 无自定义动画：让首个滑块参数在区间内往返扫描，形成自动演示
        var c=this._autoCtl,s2=this.state;
        var span=c.max-c.min;
        var tri=Math.asin(Math.sin(this.t*this.speed*1.1))*2/Math.PI; // -1..1 三角波
        s2[c.key]=c.min+span*(tri+1)/2;
        if(c.onchange)c.onchange(this,s2);
        refreshControls(s2);
      }
      this.draw();
    }
  };

  /* 让 _ 可用（精简版 bind 包装） */
  var _={bind:function(fn,ctx){return function(){return fn.apply(ctx,arguments);};}};

  /* ---------- 控件渲染 ---------- */
  function renderControls(model,state,board,host){
    host.innerHTML='';
    (model.controls||[]).forEach(function(c){
      if(c.type==='range'){
        var wrap=document.createElement('div');wrap.className='mh-ctl';
        var lab=document.createElement('div');lab.className='mh-ctl-lab';
        var name=document.createElement('span');name.textContent=c.label;
        var val=document.createElement('b');val.id='mhv-'+c.key;
        val.setAttribute('data-digits',c.digits!=null?c.digits:'');
        val.textContent=fmt(state[c.key],c.digits);
        lab.appendChild(name);lab.appendChild(val);
        var input=document.createElement('input');
        input.type='range';input.id='mhr-'+c.key;
        input.min=c.min;input.max=c.max;input.step=c.step||0.01;
        input.value=state[c.key];
        input.setAttribute('aria-label',c.label);
        input.oninput=function(){
          board._tween=null; // 用户手动操作优先，取消进行中的补间动画
          state[c.key]=parseFloat(input.value);
          val.textContent=fmt(state[c.key],c.digits);
          if(c.onchange)c.onchange(board,state);
          board.draw();
        };
        wrap.appendChild(lab);wrap.appendChild(input);host.appendChild(wrap);
      }else if(c.type==='check'){
        var l=document.createElement('label');l.className='mh-check';
        var i=document.createElement('input');i.type='checkbox';i.id='mhc-'+c.key;
        i.checked=!!state[c.key];
        i.onchange=function(){
          state[c.key]=i.checked;
          if(c.onchange)c.onchange(board,state);
          board.draw();
        };
        var s=document.createElement('span');s.textContent=c.label;
        l.appendChild(i);l.appendChild(s);host.appendChild(l);
      }else if(c.type==='buttons'){
        var g=document.createElement('div');g.className='mh-btnrow';
        c.items.forEach(function(it){
          var b=document.createElement('button');b.className='mh-mini';
          b.textContent=it.label;
          b.onclick=function(){it.onclick(board,state);board.draw();};
          g.appendChild(b);
        });
        host.appendChild(g);
      }else if(c.type==='button'){
        var btn=document.createElement('button');btn.className='mh-mini mh-wide';
        btn.id='mhb-'+c.key;btn.textContent=c.label;
        btn.onclick=function(){c.onclick(board,state);board.draw();};
        host.appendChild(btn);
      }
    });
  }
  function fmt(v,d){
    if(typeof v!=='number')return v;
    return d!=null?v.toFixed(d):(Math.abs(v%1)<1e-9?v.toString():v.toFixed(2));
  }
  function refreshControls(state){
    for(var k in state){
      var r=document.getElementById('mhr-'+k);
      if(r)r.value=state[k];
      var v=document.getElementById('mhv-'+k);

      }
      var c=document.getElementById('mhc-'+k);
      if(c)c.checked=!!state[k];
    }
  }

    models:MODEL_REGISTRY,

  };
})(window);

    for(var j=-4;j<=4;j++){if(j!==0){b.line(P(-0.06,j),P(0.06,j),'var(--mh-muted)',1);

  }
  /* 主直线 + 截距点 B + 斜率三角形 Q + x 轴交点；返回用于读数的小工具 */
  function linMain(b,s){
    var P=linP,k=s.k,bb=s.b;
    b.line(P(-6.3,-6.3*k+bb),P(6.3,6.3*k+bb),C.blue,3.4);
    var Bp=P(0,bb);b.circle(Bp,8,C.orange,'#fff',2.6);b.handle(Bp,'B',20);
    b.text({x:Bp.x+12,y:Bp.y-10},'B(0,'+linNF(bb,1)+')',C.orange,12,'start',700);
    var dx=2,qy=k*dx+bb,Hpt=P(dx,bb),Qp=P(dx,qy);
    b.line(Bp,Hpt,'#4f7a5b',1.8,'5 4');b.line(Hpt,Qp,'#4f7a5b',1.8,'5 4');
    b.circle(Qp,7,C.green,'#fff',2.4);b.handle(Qp,'Q',20);
    b.text({x:(Bp.x+Hpt.x)/2,y:Bp.y+18},'Δx='+dx,'#4f7a5b',11,'middle',700);
    b.text({x:Qp.x+10,y:(Hpt.y+Qp.y)/2},'Δy='+linNF(k*dx,1),'#4f7a5b',11,'start',700);
    b.text({x:Qp.x+10,y:Qp.y-11},'Q 改斜率',C.green,11,'start',700);
    if(Math.abs(k)>0.03){var xx=-bb/k;
      if(xx>=-6.3&&xx<=6.3){var Xp=P(xx,0);b.circle(Xp,5,C.blue,'#fff',2);
        b.text({x:Xp.x,y:Xp.y+32},'('+linNF(xx,2)+',0)',C.blue,11,'middle',700);}}
  }
  function linQuads(kk,b0){
    if(Math.abs(kk)<0.03)return b0>0.03?'一、二':b0<-0.03?'三、四':'—';
    if(Math.abs(b0)<0.03)return kk>0?'一、三':'二、四';
    if(kk>0)return b0>0?'一、二、三':'一、三、四';
    return b0>0?'一、二、四':'二、三、四';
  }
  function linTrend(k){return k>0.03?'↗ k>0 递增':k<-0.03?'↘ k<0 递减':'→ k=0 水平';}
  /* 两页共用的拖拽：B 只改 b（上下平移），Q 只改 k（绕 B 旋转） */
  function linOnDrag(b,n,w){
    b._tween=null; // 手动拖拽优先，取消进行中的补间动画
    var s=b.state,m=linT(w);
    if(n==='B')s.b=Math.max(-4,Math.min(4,Math.round(m.y*10)/10));
    else if(n==='Q')s.k=Math.max(-4,Math.min(4,Math.round((m.y-s.b)/2*10)/10));
    H.refreshControls(s);
  }
  /* 缓入缓出按钮：先结算上一段补间到稳定终点，再基于当前真实状态取反，
     保证连续/快速点击每次都正确（不会出现取到中间值而取反不到位）。 */
  function linKFlip(bd){
    bd.finishTween();
    var s=bd.state;
    bd.tweenTo({k:Math.round(-s.k*10)/10},0.55);
  }
  function linBFlip(bd){
    bd.finishTween();
    var s=bd.state;
    bd.tweenTo({b:Math.round(-s.b*10)/10},0.55);
  }

  function locus(k,A,B){
    var dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy);
    if(Math.abs(k-1)<1e-9)return{type:'line',M:{x:(A.x+B.x)/2,y:(A.y+B.y)/2},perp:{x:-dy/d,y:dx/d},d:d};
    var D={x:A.x+k/(1+k)*dx,y:A.y+k/(1+k)*dy},s=k/(k-1);
    var E={x:A.x+s*dx,y:A.y+s*dy};
    return{type:'circle',D:D,E:E,O:mid(D,E),r:dist(D,E)/2,d:d};
  }

  /* ---------- 轻量 LaTeX → MathML 渲染器（零依赖） ----------
     支持初中常见语法：$…$ 行内公式、\frac{}{}、\sqrt[]{}/√、^{}/^、_{}/_、
     希腊字母与运算符命令；未包 $ 的纯文本会智能识别 Unicode 数学记号，

  var TEX_SYM={
    alpha:'α',beta:'β',gamma:'γ',delta:'δ',theta:'θ',lambda:'λ',mu:'μ',pi:'π',sigma:'σ',phi:'φ',omega:'ω',
    Alpha:'Α',Beta:'Β',Gamma:'Γ',Delta:'Δ',Theta:'Θ',Lambda:'Λ',Pi:'Π',Sigma:'Σ',Phi:'Φ',Omega:'Ω',
    times:'×',div:'÷',cdot:'·',pm:'±',mp:'∓',le:'≤',leq:'≤',ge:'≥',geq:'≥',ne:'≠',neq:'≠',approx:'≈',
    in:'∈',notIn:'∉',infty:'∞',sum:'∑',prod:'∏',int:'∫',angle:'∠',triangle:'△',perp:'⊥',parallel:'∥',
    Rightarrow:'⇒',Leftarrow:'⇐',Leftrightarrow:'⇔',to:'→',mapsto:'↦',circ:'∘',degree:'°',
    forall:'∀',exists:'∃',therefore:'∴',because:'∵',ll:'≪',gg:'≫',subset:'⊂',subseteq:'⊆',cup:'∪',cap:'∩',
    empty:'∅',partial:'∂',ell:'ℓ',prime:'′',quad:' ',qquad:' ', ' ': ' '
  };
  var TEX_ESC={'\\':'\\','{':'{','}':'}','$':'$','%':'%','&':'&','_':'_','#':'#'};
  /* 把源串解析成 MathML 节点序列（ES5 兼容，手写递归解析） */
  function texNodes(src){
    var i=0,n=src.length,out=[];
    function exitGroup(stopBrace){return stopBrace?'}':null;}
    function parseArg(){
      // 跳过空白
      while(i<n&&src.charAt(i)===' ')i++;
      if(i<n&&src.charAt(i)==='{'){
        i++;return parseList(true);
      }
      if(i<n&&src.charAt(i)==='\\'&&i+1<n){
        var c=src.charAt(i+1);
        if(/[a-zA-Z]/.test(c)){i+=2;return parseCommand(c);}
      }
      // 单字符参数，如 ^2、_1
      return [textNode(src.charAt(i++))];
    }
    function parseCommand(c){
      if(c==='frac'){
        var a=parseArg(),bb=parseArg();
        return ['<mfrac><mrow>'+a.join('')+'</mrow><mrow>'+bb.join('')+'</mrow></mfrac>'];
      }
      if(c==='sqrt'){
        while(i<n&&src.charAt(i)===' ')i++;
        if(i<n&&src.charAt(i)==='['){ // 根指数
          i++;var idx=[];while(i<n&&src.charAt(i)!==']')idx.push(src.charAt(i++));i++;
          var body=parseArg();
          return ['<mroot><mrow>'+body.join('')+'</mrow><mrow>'+esc(idx.join(''))+'</mrow></mroot>'];
        }
        var b=parseArg();
        return ['<msqrt><mrow>'+b.join('')+'</mrow></msqrt>'];
      }
      if(c==='text'||c==='mathrm'){
        var t=parseArg().map(function(x){return x.replace(/<mi>/g,'<mtext>').replace(/<\/mi>/g,'</mtext>');});
        return t;
      }
      if(c==='left'||c==='right'){return [];} // 括号由 unicode 直接呈现
      if(c==='big'||c==='Big'||c==='bigg'||c==='Bigg'){return [];}
      if(Object.prototype.hasOwnProperty.call(TEX_SYM,c))return ['<mo>'+esc(TEX_SYM[c])+'</mo>'];
      if(Object.prototype.hasOwnProperty.call(TEX_ESC,c))return ['<mo>'+esc(TEX_ESC[c])+'</mo>'];
      return ['<mi>'+esc(c)+'</mi>'];
    }
    /* Unicode 上标/下标字符 → 规范 MathML 上下标（突出"规范 LaTeX 展示"） */
    var SUP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9',
      '⁺':'+','⁻':'−','ⁿ':'n'};
    var SUB={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9',
      'ᵢ':'i','ₐ':'a'};
    function textNode(ch){
      if(!ch)return '';
      if(Object.prototype.hasOwnProperty.call(SUP,ch))return '<msup><mrow></mrow><mrow><mn>'+esc(SUP[ch])+'</mn></mrow></msup>';
      if(Object.prototype.hasOwnProperty.call(SUB,ch))return '<msub><mrow></mrow><mrow><mn>'+esc(SUB[ch])+'</mn></mrow></msub>';
      if(/[0-9]/.test(ch))return '<mn>'+ch+'</mn>';
      if(/[a-zA-Z]/.test(ch))return '<mi>'+ch+'</mi>';
      return '<mo>'+esc(ch)+'</mo>';
    }
    function parseList(stopBrace){
      var nodes=[];
      while(i<n){
        var ch=src.charAt(i);
        if(stopBrace&&ch==='}'){i++;break;}
        if(ch==='\\'){
          if(i+1<n&&/[a-zA-Z]/.test(src.charAt(i+1))){var c=src.charAt(i+1);i+=2;nodes=nodes.concat(parseCommand(c));continue;}
          i++;continue;
        }
        if(ch==='^'||ch==='_'){
          i++;var a=parseArg();
          if(ch==='^')nodes.push('<msup><mrow>'+(nodes.length?nodes.pop():'')+'</mrow><mrow>'+a.join('')+'</mrow></msup>');
          else nodes.push('<msub><mrow>'+(nodes.length?nodes.pop():'')+'</mrow><mrow>'+a.join('')+'</mrow></msub>');
          continue;
        }
        if(ch==='$'){i++;continue;}
        /* Unicode 上下标附着到前一个节点，形成规范 msup/msub（而非孤立字符） */
        if(Object.prototype.hasOwnProperty.call(SUP,ch)||Object.prototype.hasOwnProperty.call(SUB,ch)){
          var isSup=Object.prototype.hasOwnProperty.call(SUP,ch);
          var val=isSup?SUP[ch]:SUB[ch];
          var base=nodes.length?nodes.pop():'';
          nodes.push('<'+(isSup?'msup':'msub')+'><mrow>'+base+'</mrow><mrow><mn>'+esc(val)+'</mn></mrow></'+(isSup?'msup':'msub')+'>');
          i++;continue;
        }
        nodes.push(textNode(ch));i++;
      }
      return nodes;
    }
    return parseList(false);
  }
  /* 把一段含 $…$ 或纯 Unicode 数学记号的文本渲染为 HTML。
     中文叙述保留；数学表达式用 <math> 规范排版。 */
  function tex(str){
    if(str==null)return '';
    str=String(str);
    // 含 $...$：逐段渲染
    if(str.indexOf('$')>=0){
      var parts=str.split('$'),h='',math=false;
      for(var i=0;i<parts.length;i++){

        else if(!math)h+=esc(parts[i]);
        math=!math;
      }
      return h;
    }
    // 纯文本：把连续数学片段（不含中文）转为 MathML，中文叙述保留
    var segs=str.split(/([\u4e00-\u9fff，。、；：（）「」“”‘’｜　\s]+)/);
    var html='';
    for(var k=0;k<segs.length;k++){

      if(!s)continue;
      if(/^[\u4e00-\u9fff，。、；：（）「」“”‘’｜　\s]+$/.test(s)){html+=esc(s);continue;}
      // 数学片段：直接解析（Unicode 记号走 textNode，已覆盖常见符号）
      html+='<math class="mh-math" xmlns="http://www.w3.org/1998/Math/MathML"><mrow>'+texNodes(s).join('')+'</mrow></math>';
    }
    return html;
  }

        '<div><b>'+domCount+'</b><span>知识领域</span></div>'+
        '<div><b>'+topicCount+'</b><span>主题单元</span></div>'+
        '<div><b>'+favCount+'</b><span>我的收藏</span></div>'+
      '</div></div>';

    // 收藏区
    var favModels=[];for(var id in favs)if(favs[id]&&models[id])favModels.push(models[id]);
    if(favModels.length){
      html+='<div class="mh-section-title"><i></i>我的收藏</div><div class="mh-cards">'+
        favModels.map(cardHTML).join('')+'</div>';
    }

    html+='<div class="mh-section-title"><i></i>四大知识领域</div><div class="mh-domains">'+
      DOMAINS.map(function(d){
        var ms=modelsOf(d.id);
        var doneN=ms.filter(function(m){return done[m.id];}).length;
        return '<div class="mh-domain" data-d="'+d.id+'" style="--dc:'+d.color+'">'+
          '<h3>'+d.name+'</h3><p>'+d.desc+'</p>'+
          '<div class="mh-dom-meta">'+
            '<div><b>'+ms.length+'</b>模型</div>'+
            '<div><b>'+TOPICS[d.id].length+'</b>主题</div>'+
            '<div><b>'+doneN+'</b>已学</div>'+
          '</div></div>';
      }).join('')+'</div>';
    document.getElementById('mh-view').innerHTML=html;
    Array.prototype.forEach.call(document.querySelectorAll('.mh-domain'),function(el){
      el.onclick=function(){go('#/d/'+el.getAttribute('data-d'));};
    });
    bindCards();
  }

  function cardHTML(m){
    return '<article class="mh-card'+(done[m.id]?' done':'')+'" data-id="'+m.id+'">'+
      '<div class="mh-card-head">'+
        '<h4 class="mh-card-title">'+esc(m.title)+'</h4>'+
        '<span class="mh-level mh-level-'+m.level+'">'+LEVEL_NAME[m.level]+'</span>'+
      '</div>'+
      '<p class="mh-card-desc">'+esc(m.brief)+'</p>'+
      '<div class="mh-card-foot">'+
        '<span class="mh-card-go">进入实验 <span aria-hidden="true">›</span></span>'+
        '<button class="mh-fav'+(favs[m.id]?' on':'')+'" data-fav="'+m.id+'" title="收藏" aria-label="收藏 '+esc(m.title)+'">'+(favs[m.id]?'★':'☆')+'</button>'+
      '</div>'+
      '</article>';
  }
  function bindCards(){
    Array.prototype.forEach.call(document.querySelectorAll('.mh-card'),function(el){
      var id=el.getAttribute('data-id');
      el.onclick=function(e){
        if(e.target.getAttribute('data-fav'))return;
        go('#/m/'+id);
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.mh-fav'),function(b){
      b.onclick=function(e){
        e.stopPropagation();
        var id=b.getAttribute('data-fav');
        favs[id]=!favs[id];store.set('favs',favs);
        b.textContent=favs[id]?'★':'☆';b.classList.toggle('on',favs[id]);
      };
    });
  }

  /* ---------- 领域页 ---------- */
  function renderDomain(did){
    var d=domainOf(did);
    if(!d){go('#/');return;}
    var html=crumb([['首页','#/'],[d.name,null]])+
      '<div class="mh-hero" style="padding:22px 28px;border-top-color:'+d.color+'">'+
      '<h1 style="font-size:23px">'+d.name+'</h1><p>'+d.desc+'</p></div>';
    TOPICS[did].forEach(function(t){
      var ms=modelsOf(did,t.id);
      if(!ms.length)return;
      html+='<div class="mh-topic"><h3>'+t.name+' <small>'+ms.length+' 个模型</small></h3>'+
        '<div class="mh-cards">'+ms.map(cardHTML).join('')+'</div></div>';
    });
    document.getElementById('mh-view').innerHTML=html;
    bindCards();bindCrumb();
  }

  /* ---------- 模型工作台 ---------- */
  var currentBoard=null;
  // 是否具备可播放内容：自定义 step 或存在可调 range 控件
  function isPlayable(m){
    if(typeof m.step==='function')return true;
    var cs=m.controls||[];
    for(var i=0;i<cs.length;i++){
      if(cs[i].type==='range'&&typeof cs[i].min==='number'&&typeof cs[i].max==='number')return true;
    }
    return false;
  }
  function renderModel(id){
    var m=models[id];
    if(!m){go('#/');return;}
    var d=domainOf(m.domain);
    var playable=isPlayable(m);
    var html=crumb([['首页','#/'],[d.name,'#/d/'+d.id],[topicName(m.domain,m.topic),'#/d/'+d.id],[m.title,null]])+
      '<div class="mh-work">'+
        '<section class="mh-stage-col">'+
          '<div class="mh-panel mh-stage">'+
            '<div class="mh-stage-head">'+
              '<div class="mh-legend">'+(m.legend||[]).map(function(l){
                return '<span><i style="border-color:'+l.c+'"></i>'+l.t+'</span>';
              }).join('')+'</div>'+
              '<div class="mh-zoom">'+
                '<button id="mh-lock" class="mh-lock" aria-pressed="true" title="画布已锁定，点击解锁后可编辑">🔒 已锁定</button>'+
                '<button id="mh-zo">－</button><span class="zlevel" data-mh-z="mh-svg">100%</span><button id="mh-zi">＋</button>'+
              '</div>'+
            '</div>'+
            '<div class="mh-canvas-wrap">'+
              '<svg id="mh-svg" class="mh-canvas" viewBox="0 0 '+(m.W||900)+' '+(m.H||600)+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+esc(m.title)+'互动演示"></svg>'+
              '<div class="mh-lock-veil" id="mh-lock-veil" aria-hidden="false"><span class="mh-lock-msg">🔒 画布已锁定 · 点击右上角「解锁」后可编辑</span></div>'+
            '</div>'+
            '<div class="mh-readout-wrap"><div id="mh-readout" aria-live="polite">准备就绪</div></div>'+
            '<div class="mh-hint">'+(m.interaction||'点右上角 ＋/－ 缩放，拖动图形空白处平移；拖动关键点观察变化。')+'</div>'+
          '</div>'+
        '</section>'+
        '<aside class="mh-panel mh-side" id="mh-side">'+
          '<button class="mh-fold" id="mh-fold" aria-expanded="false"><span class="mh-fold-t">调节与操作</span><span class="mh-fold-caret">▾</span></button>'+
          '<div class="mh-side-body" id="mh-side-body">'+
            '<h3 class="mh-side-h">调节与操作</h3><p class="mh-side-sub">'+(m.hint||'拖动点、调节参数，观察规律')+'</p>'+
            '<div id="mh-controls"></div>'+
            '<div class="mh-side-divider"></div>'+
            '<div class="mh-btnrow">'+
              (playable?'<button class="mh-mini" id="mh-play">▶ 播放</button>':'')+
              '<button class="mh-mini" id="mh-reset">↺ 重置</button>'+
            '</div>'+
            '<div class="mh-side-divider"></div>'+
            '<label class="mh-check"><input type="checkbox" id="mh-done"'+(done[m.id]?' checked':'')+'><span>标记为已学</span></label>'+
          '</div>'+
        '</aside>'+
        '<div class="mh-panel mh-notes" id="mh-notes"></div>'+
      '</div>';
    document.getElementById('mh-view').innerHTML=html;
    bindCrumb();
    renderNotes(m);
    // 初始化引擎
    var svg=document.getElementById('mh-svg');
    currentBoard=new M.Board(svg,m);
    M.renderControls(m,currentBoard.state,currentBoard,document.getElementById('mh-controls'));
    // 播放/重置
    var playBtn=document.getElementById('mh-play');
    function updPlay(){if(!playBtn)return;playBtn.textContent=currentBoard.playing?'⏸ 暂停':'▶ 播放';playBtn.classList.toggle('on',currentBoard.playing);}
    if(playBtn)playBtn.onclick=function(){currentBoard.playing=!currentBoard.playing;updPlay();};
    document.getElementById('mh-reset').onclick=function(){
      currentBoard.resetView();
      if(m.init){currentBoard.state={};m.init(currentBoard,currentBoard.state);}
      if(m.onReset)m.onReset(currentBoard,currentBoard.state);
      currentBoard.t=0;M.refreshControls(currentBoard.state);currentBoard.draw();updPlay();
    };
    /* 唯一的缩放入口：锁定键右侧的 ＋/－ 按钮（zoomAt 内部仍受 locked 约束） */
    document.getElementById('mh-zi').onclick=function(){currentBoard.zoomAt(1.25);};
    document.getElementById('mh-zo').onclick=function(){currentBoard.zoomAt(0.8);};
    // 画布锁定开关：默认锁定，须手动解锁；每个 Board 实例独立
    var lockBtn=document.getElementById('mh-lock');
    var lockVeil=document.getElementById('mh-lock-veil');
    function syncLockUI(locked){
      lockBtn.textContent=locked?'🔒 已锁定':'🔓 解锁';
      lockBtn.setAttribute('aria-pressed',locked?'true':'false');
      lockBtn.title=locked?'画布已锁定，点击解锁后可编辑（拖动点位、平移、缩放）':'点击锁定画布，锁定后不可编辑';
      if(lockVeil){lockVeil.classList.toggle('hidden',!locked);lockVeil.setAttribute('aria-hidden',locked?'false':'true');}
    }
    lockBtn.onclick=function(){
      syncLockUI(currentBoard.setLocked(!currentBoard.locked));
    };
    syncLockUI(currentBoard.locked); // 初始化：Board 默认锁定
    // 控制面板折叠：移动端首屏优先画布，控件默认收起；桌面端默认展开
    var foldBtn=document.getElementById('mh-fold');
    var sideEl=document.getElementById('mh-side');
    function setFold(collapsed){
      sideEl.classList.toggle('collapsed',collapsed);
      if(foldBtn)foldBtn.setAttribute('aria-expanded',collapsed?'false':'true');
    }
    if(foldBtn)foldBtn.onclick=function(){setFold(!sideEl.classList.contains('collapsed'));};
    setFold(window.matchMedia&&window.matchMedia('(max-width:900px)').matches);
    document.getElementById('mh-done').onchange=function(e){
      done[m.id]=e.target.checked;store.set('done',done);
    };
    // 模型可自定义初始是否播放
    if(m.autoplay){currentBoard.playing=true;updPlay();}
  }

  function renderNotes(m){
    var h='<h3>📌 一句话结论</h3><div class="mh-oneline">'+(m.idea||m.brief)+'</div>';
    if(m.proof){
      h+='<h3>🧠 思路与证明</h3>';
      if(typeof m.proof==='string')h+='<p>'+m.proof+'</p>';
      else if(Array.isArray(m.proof)){
        h+='<ol>';m.proof.forEach(function(s){h+='<li>'+s+'</li>';});h+='</ol>';
      }
    }
    if(m.formula)h+='<h3>🔢 关键公式</h3><div class="mh-formula">'+tex(m.formula)+'</div>';
    if(m.tips){
      h+='<h3>💡 操作提示</h3><ul>';
      (Array.isArray(m.tips)?m.tips:[m.tips]).forEach(function(t){h+='<li>'+t+'</li>';});
      h+='</ul>';
    }
    // 扩展内容：适用场景 / 图示需求 / 典型例题 / 易错点（复用现有样式，保持风格一致）
    function block(title,val,ordered){
      if(!val)return '';
      var s='<h3>'+title+'</h3>';
      if(Array.isArray(val)){
        s+=ordered?'<ol>':'<ul>';
        val.forEach(function(t){s+='<li>'+t+'</li>';});
        s+=ordered?'</ol>':'</ul>';
      }else s+='<p>'+val+'</p>';
      return s;
    }
    h+=block('🎯 适用场景',m.scenario);
    h+=block('🖼 图示需求',m.figure);
    h+=block('📝 典型例题',m.example,true);
    h+=block('⚠️ 易错点',m.mistakes);
    h+='<div style="margin-top:18px">'+
      '<span class="mh-tag">'+LEVEL_NAME[m.level]+'</span>'+
      '<span class="mh-tag">'+(m.tags||[]).join(' · ')+'</span></div>';
    document.getElementById('mh-notes').innerHTML=h;
  }

  function crumb(items){
    return '<div class="mh-crumb">'+items.map(function(it,i){
      if(!it[1])return '<span>'+esc(it[0])+'</span>';
      return '<a data-h="'+it[1]+'">'+esc(it[0])+'</a>';
    }).join('<span class="sep">›</span>')+'</div>';
  }
  function bindCrumb(){
    Array.prototype.forEach.call(document.querySelectorAll('.mh-crumb a'),function(a){
      a.onclick=function(){go(a.getAttribute('data-h'));};
    });
  }

  /* ---------- 顶栏滚动智能收起（仅模型页） ---------- */
  var lastScrollY=0;
  var topScrollTicking=false;
  function getTopEl(){return document.querySelector('.mh-top');}
  function resetTopHide(){
    lastScrollY=window.scrollY||window.pageYOffset||0;
    var top=getTopEl();
    if(top)top.classList.remove('mh-hide');
  }
  function updateTopOnScroll(){
    var top=getTopEl();
    if(!top)return;
    var y=window.scrollY||window.pageYOffset||0;
    if(parseHash().view!=='m'||y<=20){          /* 非模型页或到达顶部：展开 */
      top.classList.remove('mh-hide');
    }else if(y>lastScrollY+2){                  /* 向下滚动：平滑收起 */
      top.classList.add('mh-hide');
    }else if(y<lastScrollY-2){                  /* 向上滚动：重新展开 */
      top.classList.remove('mh-hide');
    }
    lastScrollY=y;
  }
  window.addEventListener('scroll',function(){
    if(topScrollTicking)return;
    topScrollTicking=true;
    requestAnimationFrame(function(){updateTopOnScroll();topScrollTicking=false;});
  },{passive:true});

  /* ---------- 路由分发 ---------- */
  function route(){
    var r=parseHash();
    if(r.view==='home')renderHome();
    else if(r.view==='d')renderDomain(r.a);
    else if(r.view==='m')renderModel(r.a);
    else renderHome();
    window.scrollTo(0,0);
    resetTopHide();                              /* 切换页面后顶栏恢复展开 */
  }

  /* ---------- 全局动画循环 ---------- */
  var last=0;
  function loop(ts){
    var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
    if(currentBoard)currentBoard.step(dt);
    requestAnimationFrame(loop);
  }

  /* ---------- 启动 ---------- */
  document.documentElement.setAttribute('data-mh-theme',theme);
  renderTop();
  window.addEventListener('hashchange',route);
  route();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
